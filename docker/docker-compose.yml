# Default: Neo4j + Agentic backend + frontend.
# Extra APIs: docker compose --profile microservices up --build
services:
  neo4j:
    image: neo4j:5
    container_name: stylesense-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - stylesense
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MOCK=${GEMINI_MOCK:-}
      - PYTHONUNBUFFERED=1
      - KG_ENABLED=${KG_ENABLED:-true}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - NEO4J_DB=neo4j
    volumes:
      - ../backend/data:/app/data:ro
      - ../backend/logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - stylesense
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  data-mesh:
    profiles: ["microservices"]
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.data-mesh
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - stylesense
    restart: unless-stopped

  data-fabric:
    profiles: ["microservices"]
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.data-fabric
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - stylesense
    restart: unless-stopped

  data-architecture:
    profiles: ["microservices"]
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.data-architecture
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - stylesense
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_DATA_MESH_API_URL=http://localhost:8001
      - VITE_DATA_FABRIC_API_URL=http://localhost:8002/api
      - VITE_DATA_ARCH_API_URL=http://localhost:8003/api
    networks:
      - stylesense
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  stylesense:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
